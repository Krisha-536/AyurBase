<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AyurSense | Your Remedy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700;800&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .results-wrap {
            min-height: 100vh;
            padding: 110px 5% 60px;
            position: relative;
            z-index: 2;
            max-width: 860px;
            margin: 0 auto;
        }

        .results-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.4rem;
            font-weight: 700;
            background: var(--gradient-1);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            margin-bottom: 0.3rem;
        }

        .results-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        /* ── Loading state ── */
        .loading-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 32px;
            padding: 3rem 2rem;
            text-align: center;
            backdrop-filter: blur(12px);
        }

        .big-spinner {
            width: 52px;
            height: 52px;
            border: 3px solid rgba(230,200,122,0.2);
            border-top-color: var(--accent-gold);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Severe Warning Card ── */
        .severe-card {
            background: rgba(180,30,30,0.12);
            border: 1px solid rgba(220,50,50,0.4);
            border-radius: 32px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            margin-bottom: 1.5rem;
        }

        .severe-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: rgba(220,50,50,0.2);
            border: 1px solid rgba(220,50,50,0.5);
            border-radius: 60px;
            padding: 0.3rem 1rem;
            font-size: 0.82rem;
            font-weight: 700;
            color: #ff6b6b;
            margin-bottom: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .severe-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: #ff8080;
            margin-bottom: 0.6rem;
        }

        .severe-msg {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.6;
            margin-bottom: 1.2rem;
        }

        /* ── Remedy Card ── */
        .remedy-card {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 32px;
            padding: 2rem;
            backdrop-filter: blur(12px);
            margin-bottom: 1.2rem;
            transition: border-color 0.2s;
        }

        .remedy-card:hover { border-color: var(--accent-gold); }

        .card-label {
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin-bottom: 0.6rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .disease-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 0.3rem;
        }

        .reasoning-text {
            font-size: 0.88rem;
            color: var(--text-secondary);
            line-height: 1.5;
            font-style: italic;
        }

        .remedy-text {
            font-size: 0.95rem;
            color: var(--text-primary);
            line-height: 1.7;
        }

        .medicines-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .med-pill {
            background: rgba(45,106,79,0.2);
            border: 1px solid rgba(64,145,108,0.4);
            border-radius: 60px;
            padding: 0.3rem 0.9rem;
            font-size: 0.8rem;
            color: #74c69d;
            font-weight: 500;
        }

        /* ── Doctors table ── */
        .doctors-section { margin-top: 0.5rem; }

        .doctor-row {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            align-items: flex-start;
            padding: 0.9rem 0;
            border-bottom: 1px solid rgba(230,200,122,0.1);
        }

        .doctor-row:last-child { border-bottom: none; }

        .doctor-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-primary);
            flex: 1;
            min-width: 160px;
        }

        .doctor-detail {
            font-size: 0.82rem;
            color: var(--text-secondary);
            flex: 2;
            min-width: 180px;
        }

        .doctor-contact {
            font-size: 0.82rem;
            color: var(--accent-gold);
            font-weight: 500;
            white-space: nowrap;
        }

        /* Buttons */
        .action-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn-back {
            background: var(--card-bg);
            border: var(--glass-border);
            border-radius: 60px;
            padding: 0.8rem 1.8rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-back:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        .logout-link {
            background: none;
            border: 1px solid rgba(230,200,122,0.3);
            border-radius: 40px;
            padding: 0.4rem 1rem;
            color: var(--text-secondary);
            font-size: 0.82rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-link:hover {
            border-color: var(--accent-gold);
            color: var(--accent-gold);
        }

        @media (max-width: 600px) {
            .results-title { font-size: 1.9rem; }
            .results-wrap { padding-top: 95px; }
            .disease-name { font-size: 1.6rem; }
        }
    </style>
</head>
<body>
    <div class="blob-bg"><div class="blob blob-1"></div><div class="blob blob-2"></div></div>
    <div class="particles" id="particles"></div>

    <!-- Navbar -->
    <nav class="navbar" id="navbar">
        <div class="logo">✦ AyurSense</div>
        <div style="display:flex; align-items:center; gap:1rem;">
            <a href="/dosha-quiz" style="font-size:0.82rem;color:var(--text-secondary);text-decoration:none;border:1px solid rgba(230,200,122,0.2);border-radius:40px;padding:0.4rem 1rem;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent-gold)';this.style.color='var(--accent-gold)'" onmouseout="this.style.borderColor='rgba(230,200,122,0.2)';this.style.color='var(--text-secondary)'">✦ Retake Dosha Quiz</a>
            <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
            <button class="logout-link" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>
    </nav>

    <div class="results-wrap">
        <h1 class="results-title">Your Ayurvedic Analysis</h1>
        <p class="results-sub">Based on your symptoms, here is what our AI recommends.</p>

        <!-- Content injected by results.js -->
        <div id="resultsContent">
            <div class="loading-card">
                <div class="big-spinner"></div>
                <p style="color:var(--text-secondary);">Analysing your results...</p>
            </div>
        </div>

        <div class="action-row">
            <a href="/checker" class="btn-back"><i class="fas fa-arrow-left"></i> Check Again</a>
            <a href="/dosha-quiz" class="btn-back"><i class="fas fa-redo"></i> Retake Dosha Quiz</a>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/results.js') }}"></script>
</body>
</html>
